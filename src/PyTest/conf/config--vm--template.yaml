# Required caller context (camelCase):
#   vmDataVolumeSource (non-empty mapping) and sshPublicKeyB64 (non-empty
#   string). The source must identify a real caller-owned image.
#   sshPublicKeyB64 must contain the base64 encoding of the complete raw OpenSSH
#   public-key text; cloud-init decodes it because write_files declares
#   encoding: b64. The caller owns source-schema and encoded-key validation.
# Defaultable deployment context:
#   vmName='vm-img--windows', vmNS='default',
#   vmDataVolumeName=vmName+'--vhd--00-system', vmStorageSize='96Gi',
#   vmStorageClass='gp3-csi', vmCpuCores=4, and vmMemory='8Gi'. The storage
#   defaults reproduce the source example; callers must select values supported
#   by their cluster.
{%set resolvedVMname = vmName | default('vm-img--windows') | string%}
{%set resolvedDVname = vmDataVolumeName | default(resolvedVMname + '--vhd--00-system')%}
{%set resolvedStorageSize = vmStorageSize | default('96Gi')%}
{%set resolvedStorageClass = vmStorageClass | default('gp3-csi')%}
{%set resolvedCPUcores = vmCpuCores | default(4)%}
{%set resolvedMemory = vmMemory | default('8Gi')%}
# The renderer has no raise helper. Dereferencing each missing diagnostic key
# makes Jinja report a field-specific UndefinedError for invalid context.
{%if vmDataVolumeSource is not defined%}
{{{}['vmDataVolumeSource is required'].fail}}
{%elif vmDataVolumeSource is not mapping or not vmDataVolumeSource%}
{{{}['vmDataVolumeSource must be a non-empty mapping'].fail}}
{%endif%}
{%if sshPublicKeyB64 is not defined%}
{{{}['sshPublicKeyB64 is required'].fail}}
{%elif sshPublicKeyB64 is not string or not (sshPublicKeyB64 | trim)%}
{{{}['sshPublicKeyB64 must be a non-empty string'].fail}}
{%endif%}
{%if resolvedCPUcores is not integer or resolvedCPUcores <= 0%}
{{{}['vmCpuCores must be a positive integer'].fail}}
{%endif%}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{resolvedVMname | string | tojson}}
  namespace: {{vmNS | default('default') | string | tojson}}
  labels:
    usrMeta.vmGroup: {{resolvedVMname | string | tojson}}
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
        name: {{resolvedDVname | string | tojson}}
        labels:
          usrMeta.volGroup: {{resolvedVMname | string | tojson}}
      spec:
        source: {{vmDataVolumeSource | tojson}}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{resolvedStorageSize | string | tojson}}
          storageClassName: {{resolvedStorageClass | string | tojson}}
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/domain: {{resolvedVMname | string | tojson}}
        kubevirt.io/vm: {{resolvedVMname | string | tojson}}
    spec:
      architecture: amd64
      domain:
        clock:
          timer:
            hyperv:
              present: true
        cpu:
          cores: {{resolvedCPUcores | tojson}}
          sockets: 1
          threads: 1
        devices:
          autoattachPodInterface: false
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: vhd--00-fs-rootfs
            - cdrom:
                bus: sata
              name: cloud-init-disk
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - masquerade: {}
              model: virtio
              name: nic--0
          networkInterfaceMultiqueue: true
          tpm: {}
        features:
          hyperv:
            frequencies: {}
            ipi: {}
            reenlightenment: {}
            relaxed: {}
            reset: {}
            runtime: {}
            spinlocks:
              enabled: true
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            tlbflush: {}
            vapic: {}
            vpindex: {}
          smm: {}
        firmware:
          bootloader:
            efi:
              secureBoot: true
        machine:
          type: q35
        memory:
          guest: {{resolvedMemory | string | tojson}}
        resources:
          limits:
            memory: {{resolvedMemory | string | tojson}}
          requests:
            memory: {{resolvedMemory | string | tojson}}
      networks:
        - name: nic--0
          pod: {}
      volumes:
        - dataVolume:
            name: {{resolvedDVname | string | tojson}}
          name: vhd--00-fs-rootfs
        - cloudInitNoCloud:
            userData: |
                #cloud-config
                runcmd:
                  - powershell -NoProfile -NonInteractive -WindowStyle Hidden -Command "
                        $s = \"${env:ProgramData}\Scripts\Script--App--CloudBaseInit--Main.ps1\";
                        if (Test-Path -Path $s) {& $s}
                    "
                write_files:
                  - path: C:\ProgramData\Scripts\Data--App--CloudBaseInit--SSH.txt
                    encoding: b64
                    content: {{sshPublicKeyB64 | string | tojson}}
          name: cloud-init-disk
