# Pull Request verification gate for the PyTest framework (`src/PyTest/`).
#
# Set up the framework with `setup.sh`, then run the isolated unit and the
#   offline contract suites with their explicit configurations. Never run the
#   live `test--suites/` (selected by the default `pytest.ini`).
# Enforcement: require the `PyTest PR Gate` check in branch protection or a
#   ruleset. Being path filtered, it stays Pending on PRs not touching `paths`.
name: PyTest CI

on:
  pull_request:
    paths:
      - 'src/PyTest/**'
      - '.github/workflows/pytest--pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: pytest-pr--${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  PyTest:
    name: PyTest PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/PyTest
    steps:
      - name: Check out PR merge commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up PyTest Test Suite Framework.
        run: ./setup.sh
      - name: Run unit tests.
        run: python -m pytest -c pytest--unit.ini test--unit/
      - name: Run contract tests.
        run: python -m pytest -c pytest--contract.ini test--contract/
