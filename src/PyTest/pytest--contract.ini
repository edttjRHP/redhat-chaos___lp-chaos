# From src/PyTest: python -m pytest -c pytest--contract.ini
# Real-template contracts are separate from isolated units and live suites.
[pytest]
log_cli_date_format = %Y-%m-%dT%H:%M:%SZ
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)

testpaths = test--contract
pythonpath = .
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    --confcutdir=test--contract
