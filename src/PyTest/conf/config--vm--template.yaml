{#-
# Required caller context (camelCase):
#   - vmDataVolumeSource:
#       A non-empty mapping containing a valid CDI `DataVolume.spec.source`.
#   - sshPublicKeyB64:
#       A non-empty Base64-encoded OpenSSH public-key string for guest access.
-#}
{%- if (vmDataVolumeSource is not defined) -%}
    {{ {}['The `vmDataVolumeSource` is required.'].fail }}
{%- elif ((vmDataVolumeSource is not mapping) or not vmDataVolumeSource) -%}
    {{ {}['The `vmDataVolumeSource` must be a non-empty mapping.'].fail }}
{%- endif -%}
{%- if (sshPublicKeyB64 is not defined) -%}
    {{ {}['The `sshPublicKeyB64` is required.'].fail }}
{%- elif ((sshPublicKeyB64 is not string) or not (sshPublicKeyB64 | trim)) -%}
    {{ {}['The `sshPublicKeyB64` must be a non-empty string.'].fail }}
{%- endif -%}
{%- if (
    (vmCpuCores is defined) and
    ((vmCpuCores is not integer) or (vmCpuCores <= 0))
) -%}
    {{ {}['The `vmCpuCores` must be a positive integer.'].fail }}
{%- endif -%}
{#- ---- -#}
{%- set vmAnnotations = vmAnnotations | default({}) -%}
{%- set vmName = vmName | default('vm-img--windows') -%}
{%- set vmNS = vmNS | default('default') -%}
{%- set vmDataVolumeName = (
    vmDataVolumeName | default((vmName + '--vhd--00-system'))
) -%}
{%- set vmStorageAccessModes = (
    vmStorageAccessModes | default(['ReadWriteOnce'])
) -%}
{%- set vmStorageSize = vmStorageSize | default('96Gi') -%}
{%- set vmStorageClass = vmStorageClass | default('gp3-csi') -%}
{%- set vmCpuCores = vmCpuCores | default(4) -%}
{%- set vmFeatures__Hyperv_Tlbflush__Ena = (
  vmFeatures__Hyperv_Tlbflush__Ena | default(false)
) -%}
{%- set vmMemory = vmMemory | default('8Gi') -%}
{%- set vmEvictionStrategy = vmEvictionStrategy | default(None) -%}
{%- set vmNodeSelector = vmNodeSelector | default({}) -%}
{%- set vmTolerations = vmTolerations | default([]) -%}
{%- set sshPublicKeyB64 = sshPublicKeyB64 -%}
{#- ======================================================================== -#}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  {%- if vmAnnotations %}
  annotations: {{ vmAnnotations | tojson }}
  {%- endif %}
  labels:
    usrMeta.vmGroup: {{ vmName | tojson }}
  name: {{ vmName | tojson }}
  namespace: {{ vmNS | tojson }}
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
        labels:
          usrMeta.volGroup: {{ vmName | tojson }}
        name: {{ vmDataVolumeName | tojson }}
      spec:
        source: {{ vmDataVolumeSource | tojson }}
        storage:
          accessModes: {{ vmStorageAccessModes | tojson }}
          resources:
            requests:
              storage: {{ vmStorageSize | tojson }}
          storageClassName: {{ vmStorageClass | tojson }}
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/domain: {{ vmName | tojson }}
        kubevirt.io/vm: {{ vmName | tojson }}
    spec:
      architecture: amd64
      domain:
        clock:
          timer:
            hyperv:
              present: true
        cpu:
          cores: {{ vmCpuCores | tojson }}
          sockets: 1
          threads: 1
        devices:
          autoattachPodInterface: false
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: vhd--00-fs-rootfs
            - cdrom:
                bus: sata
              name: cloud-init-disk
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - masquerade: {}
              model: virtio
              name: nic--0
          networkInterfaceMultiqueue: true
          tpm: {}
        features:
          hyperv:
            frequencies: {}
            ipi: {}
            reenlightenment: {}
            relaxed: {}
            reset: {}
            runtime: {}
            spinlocks:
              enabled: true
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            {%- if vmFeatures__Hyperv_Tlbflush__Ena %}
            tlbflush: {}
            {%- endif %}
            vapic: {}
            vpindex: {}
          smm: {}
        firmware:
          bootloader:
            efi:
              secureBoot: true
        machine:
          type: q35
        memory:
          guest: {{ vmMemory | tojson }}
        resources:
          limits:
            memory: {{ vmMemory | tojson }}
          requests:
            memory: {{ vmMemory | tojson }}
      {%- if vmEvictionStrategy %}
      evictionStrategy: {{ vmEvictionStrategy | tojson }}
      {%- endif %}
      networks:
        - name: nic--0
          pod: {}
      {%- if vmNodeSelector %}
      nodeSelector: {{ vmNodeSelector | tojson }}
      {%- endif %}
      {%- if vmTolerations %}
      tolerations: {{ vmTolerations | tojson }}
      {%- endif %}
      volumes:
        - dataVolume:
            name: {{ vmDataVolumeName | tojson }}
          name: vhd--00-fs-rootfs
        - cloudInitNoCloud:
            userData: |
                #cloud-config
                runcmd:
                  - powershell -NoProfile -NonInteractive -WindowStyle Hidden -Command "
                        $s = \"${env:ProgramData}\Scripts\Script--App--CloudBaseInit--Main.ps1\";
                        if (Test-Path -Path $s) {& $s}
                    "
                write_files:
                  - path: C:\ProgramData\Scripts\Data--App--CloudBaseInit--SSH.txt
                    encoding: b64
                    content: {{ sshPublicKeyB64 | tojson }}
          name: cloud-init-disk
