[pytest]
log_cli_date_format = %Y-%m-%dT%H:%M:%SZ
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)

testpaths = test--unit
pythonpath = . test--unit
python_files = test_*.py
addopts =
    -v
    -r all
    -p no:cacheprovider
    --strict-markers
    # Prevent module naming collisions across identical filenames in different
    #   sub-directories (e.g. `fixtures/test_VM.py` vs `libs/.../test_VM.py`).
    --import-mode=importlib
    --confcutdir=test--unit
    --cov-config=.coveragerc--unit
    --cov
    --cov-report=term-missing
    --cov-fail-under=100
